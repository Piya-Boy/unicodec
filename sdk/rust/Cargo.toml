[package]
name = "ubc"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Universal Binary Container reference SDK"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
aes-gcm = { version = "0.10", features = ["getrandom"] }
hmac = "0.12"
hkdf = "0.12"
sha2 = "0.10"
